<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You Win!</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --accent: #fbbf24;
        --accent-glow: rgba(251, 191, 36, 0.45);
        --text: #f8fafc;
        --muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top, #1d4ed8 0%, transparent 45%),
          radial-gradient(circle at bottom, #7c3aed 0%, transparent 40%),
          var(--bg);
        color: var(--text);
      }

      main {
        width: min(92vw, 420px);
        padding: 2.5rem 2rem;
        border-radius: 1.5rem;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 1.75rem;
        color: var(--muted);
        line-height: 1.5;
      }

      button {
        appearance: none;
        border: none;
        cursor: pointer;
        padding: 0.95rem 1.75rem;
        border-radius: 999px;
        font-size: 1.05rem;
        font-weight: 700;
        color: #111827;
        background: linear-gradient(135deg, #fde68a, var(--accent));
        box-shadow: 0 10px 30px var(--accent-glow);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 36px var(--accent-glow);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
        transform: none;
      }

      #message {
        margin-top: 1.75rem;
        min-height: 4.5rem;
        display: grid;
        place-items: center;
        font-size: 2.4rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--accent);
        opacity: 0;
        transform: scale(0.85);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }

      #message.visible {
        opacity: 1;
        transform: scale(1);
      }

      .confetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .confetti span {
        position: absolute;
        top: -12px;
        width: 10px;
        height: 16px;
        border-radius: 2px;
        opacity: 0;
        animation: fall 1.4s ease-out forwards;
      }

      @keyframes fall {
        0% {
          opacity: 1;
          transform: translateY(0) rotate(0deg);
        }
        100% {
          opacity: 0;
          transform: translateY(110vh) rotate(720deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <main>
      <h1>Prompt 81</h1>
      <p>Click the button to play the victory message.</p>
      <button id="play-btn" type="button">Click me!</button>
      <div id="message" aria-live="polite"></div>
    </main>

    <script>
      const WIN_MESSAGE = "You win!";
      const CONFETTI_COLORS = ["#fbbf24", "#f472b6", "#60a5fa", "#34d399", "#fb7185"];

      const playButton = document.getElementById("play-btn");
      const messageEl = document.getElementById("message");
      const confettiEl = document.getElementById("confetti");

      function launchConfetti() {
        confettiEl.replaceChildren();

        for (let i = 0; i < 36; i += 1) {
          const piece = document.createElement("span");
          piece.style.left = `${Math.random() * 100}%`;
          piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
          piece.style.animationDelay = `${Math.random() * 0.35}s`;
          confettiEl.appendChild(piece);
        }
      }

      function speakWinMessage() {
        if (!("speechSynthesis" in window)) {
          return;
        }

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(WIN_MESSAGE);
        utterance.rate = 1;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }

      function showWinMessage() {
        messageEl.textContent = WIN_MESSAGE;
        messageEl.classList.add("visible");
        launchConfetti();
        speakWinMessage();
      }

      playButton.addEventListener("click", showWinMessage);
    </script>
  </body>
</html>
